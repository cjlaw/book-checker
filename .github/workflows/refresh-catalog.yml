name: Refresh catalog

on:
  schedule:
    - cron: '0 8 * * 1'  # Mondays at 8am UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CATALOG_DEPLOY_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh catalog
        run: python3 generate-catalog.py

      - name: Commit and push if catalog changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json enrichment-cache.json crawl-entries.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh catalog"
            git push
          fi
