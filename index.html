<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Checker — Melissa ISD</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js" integrity="sha384-PCSoOZTpbkikBEtd/+uV3WNdc676i9KUf01KOA8CnJotvlx8rRrETbDuwdjqTYvt" crossorigin="anonymous"></script>
</head>
<body>

  <header>
    <img src="https://cmsv2-assets.apptegy.net/uploads/6356/logo/7458/Web__Header.png" alt="Melissa Schools" height="52" />
  </header>

  <main>
    <div class="page-heading">
      <h1>Book Checker</h1>
      <p>Check if books are in the Melissa ISD library catalog.</p>
      <div class="accent-bar"></div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" id="tabSingle" role="tab" aria-selected="true" aria-controls="paneSingle">One Book</button>
      <button class="tab-btn" id="tabBulk" role="tab" aria-selected="false" aria-controls="paneBulk">A Whole List</button>
    </div>

    <div id="paneSingle" class="card">
      <label class="search-label" for="searchInput">Title</label>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="e.g. Dog Man"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />

      <div id="loadingIndicator" class="loading-indicator" style="display:none;">
        Loading book list…
      </div>

      <div id="emptyState" class="empty-state">
        Type a book title above — we'll check it against the Melissa ISD library catalog.
      </div>

      <div id="result" class="result" aria-live="polite" aria-atomic="true"></div>

      <div class="status-bar">
        <p class="status-text" id="statusText"></p>
      </div>
    </div>

    <div id="paneBulk" class="card" style="display:none;">
      <label class="paste-label" for="pasteInput">Check a list of books</label>
      <p class="paste-hint">One book per line. You can paste directly from Excel or Sheets.</p>
      <textarea
        id="pasteInput"
        class="paste-input"
        rows="5"
        placeholder="Farmhouse&#10;Freewater&#10;Powwow Day"
        spellcheck="false"
        autocorrect="off"
      ></textarea>
      <button class="search-btn paste-btn" id="pasteBtn">Check List</button>

      <div class="csv-toggle-row">
        <button class="csv-toggle-btn" id="csvToggleBtn">or upload a CSV export instead</button>
      </div>

      <div id="csvSection" style="display:none;">
        <div class="upload-row">
          <input type="file" id="csvInput" class="upload-input" accept=".csv,text/csv" />
          <button class="search-btn" id="bulkBtn">Check</button>
        </div>
      </div>

      <div id="bulkResults" class="bulk-results" aria-live="polite" aria-atomic="true"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
